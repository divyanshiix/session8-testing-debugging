[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "session8-number-analyzer"
version = "0.1.0"
description = "A small, production-ready CLI for numeric summary analysis."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "session8 contributors" }]
dependencies = []

[project.scripts]
session8-analyze = "session8_app.cli:main"

[project.optional-dependencies]
dev = [
  "black==24.10.0",
  "mypy==1.13.0",
  "pytest==8.3.3",
  "ruff==0.7.1",
  "pre-commit==4.0.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
